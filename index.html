<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka Shopee...</title>
    
    <!-- Open Graph agar tampilan pratinjau di FB tetap rapi -->
    <meta property="og:title" content="Lihat Produk di Shopee" />
    <meta property="og:description" content="Klik untuk langsung membuka produk di aplikasi Shopee." />

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20%;
            background-color: #f8f9fa;
        }
        .btn-shopee {
            display: inline-block;
            background-color: #ee4d2d;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <p>Sedang mengalihkan ke aplikasi Shopee...</p>
    
    <!-- Tombol manual jika redirect otomatis tertahan -->
    <a id="shopeeBtn" class="btn-shopee" href="#">Buka Aplikasi Shopee</a>

    <script>
        // 1. Tentukan URL Tujuan (Ganti dengan link produk / affiliate Anda)
        var originalUrl = "https://s.shopee.co.id/9fKHRzwPRt"; 
        
        // 2. Format Deep Link / Intent
        // Android Intent Format
        var androidIntent = "intent://" + originalUrl.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.shopee.id;S.browser_fallback_url=" + encodeURIComponent(originalUrl) + ";end";
        
        // iOS Deep Link Scheme
        var iosScheme = "shopeeid://";

        var userAgent = navigator.userAgent || navigator.vendor || window.opera;

        // Pasang link ke tombol manual
        var btn = document.getElementById("shopeeBtn");

        if (/android/i.test(userAgent)) {
            btn.href = androidIntent;
            // Jalankan redirect otomatis
            window.location.href = androidIntent;
        } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            btn.href = originalUrl;
            // Coba buka scheme app di iOS, jika gagal tetap di URL web
            window.location.href = iosScheme;
            setTimeout(function() {
                window.location.href = originalUrl;
            }, 1500);
        } else {
            // Jika dibuka dari Laptop/PC Desktop
            btn.href = originalUrl;
            window.location.href = originalUrl;
        }
    </script>
</body>
</html>
