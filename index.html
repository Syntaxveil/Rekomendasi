<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=shopeeid://universal-link?url=https%3A%2F%2Fshope.ee%2Fxxxxxx" />
    <script>
        // GANTI LINK DI BAWAH INI DENGAN LINK AFFILIATE ANDA
        var targetUrl = "https://s.shopee.co.id/7VFmcEzxkv"; 
        var shopeeScheme = "shopeeid://universal-link?url=" + encodeURIComponent(targetUrl);

        window.onload = function() {
            // Mencoba membuka aplikasi
            window.location.href = shopeeScheme;
            
            // Jika aplikasi tidak terbuka dalam 1,5 detik, arahkan ke web
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 1500);
        };
    </script>
</head>
