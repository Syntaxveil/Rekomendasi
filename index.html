<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mengalihkan...</title>
</head>
<body>
    <script>
        var targetUrl = "https://s.shopee.co.id/6AkPfbwsBS"; // Link Shopee Anda
        var cleanUrl = targetUrl.replace(/^https?:\/\//, '');

        // Trik Android: Lempar via Download Manager Header
        var intent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.shopee.id;action=android.intent.action.VIEW;end";

        // Buat blob file kosong untuk memaksa IAB keluar
        try {
            var blob = new Blob([""], { type: "application/octet-stream" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = intent;
            a.download = "";
            document.body.appendChild(a);
            a.click();
        } catch(e) {
            window.location.href = intent;
        }
    </script>
</body>
</html>
