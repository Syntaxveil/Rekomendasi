<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diskon Spesial Hari Ini - Shopee</title>
    
    <!-- Preview Card Facebook / Meta Tags -->
    <meta property="og:title" content="🔥 Promo Spesial Produk Pilihan di Shopee" />
    <meta property="og:description" content="Klaim voucher diskon & gratis ongkir ekstra sekarang juga!" />
    <meta property="og:image" content="https://cf.shopee.co.id/file/d4b2450da22feed2a041f4ba40e0b96b" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #ee4d2d 0%, #f5f5f5 35%, #f5f5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
            position: relative;
        }

        .top-banner {
            background: #ff5722;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 0;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .product-img-box {
            position: relative;
            width: 100%;
            height: 220px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img-box img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .badge-discount {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ffe143;
            color: #ee4d2d;
            font-size: 12px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .content {
            padding: 20px 20px 24px;
        }

        .title {
            font-size: 17px;
            font-weight: 700;
            color: #222;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 18px;
        }

        .benefits {
            display: flex;
            justify-content: space-around;
            background: #fff6f4;
            border: 1px dashed #ee4d2d;
            border-radius: 10px;
            padding: 10px 8px;
            margin-bottom: 22px;
        }

        .benefit-item {
            font-size: 12px;
            color: #ee4d2d;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-shopee {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #ff5722 0%, #ee4d2d 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            padding: 16px 0;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(238, 77, 45, 0.4);
            animation: pulse-btn 1.8s infinite;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-shopee:active {
            transform: scale(0.97);
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 0 0 rgba(238, 77, 45, 0.6); }
            70% { box-shadow: 0 0 0 14px rgba(238, 77, 45, 0); }
            100% { box-shadow: 0 0 0 0 rgba(238, 77, 45, 0); }
        }

        .secure-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
            font-size: 12px;
            color: #888;
        }

        .secure-info svg {
            width: 14px;
            height: 14px;
            fill: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Banner Promo Atas -->
        <div class="top-banner">
            🔥 PROMO TERBATAS EKSKLUSIF
        </div>

        <!-- Gambar / Ikon Display Produk -->
        <div class="product-img-box">
            <span class="badge-discount">VOUCHER 50%</span>
            <img src="https://deo.shopeemobile.com/shopee/shopee-pcmall-live-sg/assets/ca5d12864c12916c05640b36e47ac5c9.png" alt="Shopee Mall">
        </div>

        <!-- Konten Penawaran -->
        <div class="content">
            <h1 class="title">Buka Produk & Klaim Diskon Spesial</h1>
            <p class="subtitle">Ambil voucher gratis ongkir dan promo harga terbaik langsung di aplikasi Shopee.</p>

            <!-- Benefit Box -->
            <div class="benefits">
                <div class="benefit-item">🚚 Bebas Ongkir</div>
                <div class="benefit-item">⚡ Diskon Kilat</div>
                <div class="benefit-item">🔒 COD Aman</div>
            </div>

            <!-- Tombol Aksi Utama -->
            <a id="btnDirect" class="btn-shopee" href="#">
                BUKA DI APLIKASI SHOPEE
            </a>

            <!-- Footer Keamanan -->
            <div class="secure-info">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                Garansi Transaksi Aman Resmi Shopee
            </div>
        </div>
    </div>

    <script>
        // Masukkan link Shopee Affiliate atau URL produk Anda di sini:
        var originalUrl = "https://s.shopee.co.id/6q06TWUANG"; 

        var cleanUrl = originalUrl.replace(/^https?:\/\//, '');
        var ua = navigator.userAgent || "";
        var btn = document.getElementById("btnDirect");

        // Format Intent Android & Scheme iOS
        var androidIntent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.shopee.id;S.browser_fallback_url=" + encodeURIComponent(originalUrl) + ";end";
        var iosScheme = "shopeeid://universal-link?url=" + encodeURIComponent(originalUrl);

        if (/android/i.test(ua)) {
            btn.href = androidIntent;
        } else if (/iphone|ipad|ipod/i.test(ua)) {
            btn.href = iosScheme;
        } else {
            btn.href = originalUrl;
        }
    </script>
</body>
</html>
