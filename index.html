<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka Shopee...</title>
</head>
<body style="background:#ffffff; font-family:sans-serif; text-align:center; padding-top:40px;">
    <p style="color:#555;">Memuat...</p>

    <script>
        // Masukkan tautan Shopee / Affiliate Anda di sini
        var targetUrl = "https://s.shopee.co.id/7VFmcEzxkv";

        // Ekstrak ID/Path untuk scheme Shopee
        var rawPath = targetUrl.replace(/^https?:\/\//, '');
        var customScheme = "shopeeid://universal-link?url=" + encodeURIComponent(targetUrl);

        // 1. Trik Iframe: Menembus webview tanpa memicu event window navigation di FB
        var iframe = document.createElement("iframe");
        iframe.style.border = "none";
        iframe.style.width = "1px";
        iframe.style.height = "1px";
        iframe.src = customScheme;
        document.body.appendChild(iframe);

        // 2. Fallback jika iframe tidak langsung mengeksekusi
        setTimeout(function() {
            window.location.href = targetUrl;
        }, 1200);
    </script>
</body>
</html>
