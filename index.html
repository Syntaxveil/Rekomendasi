<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka Shopee...</title>
</head>
<body style="text-align:center; padding-top:20%; font-family:sans-serif;">

    <p>Sedang membuka Shopee...</p>

    <script>
        // Masukkan link Shopee / Affiliate Anda di sini
        var rawUrl = "https://s.shopee.co.id/7VFmcEzxkv"; 

        var cleanUrl = rawUrl.replace(/^https?:\/\//, '');
        var userAgent = navigator.userAgent || "";

        // Deteksi in-app browser Facebook di Android
        var isFB = userAgent.indexOf("FBAN") > -1 || userAgent.indexOf("FBAV") > -1;
        var isAndroid = /android/i.test(userAgent);

        if (isFB && isAndroid) {
            // Trik bypass: Buka via Chrome Intent agar tidak memicu pop-up FB
            window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
        } else if (isAndroid) {
            // Jika sudah di luar FB, tembak langsung ke aplikasi Shopee
            window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.shopee.id;end";
        } else {
            // iPhone / PC Desktop
            window.location.href = rawUrl;
        }
    </script>
</body>
</html>
