<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka Shopee...</title>
</head>
<body style="background:#ffffff; font-family:sans-serif; text-align:center; padding-top:40px;">
    <p style="color:#555;">Membuka aplikasi...</p>

    <script>
        // 1. GANTI DENGAN LINK SHOPEE/AFFILIATE ANDA
        var targetUrl = "https://s.shopee.co.id/7VFmcEzxkv";

        // Bersihkan protokol http/https
        var cleanUrl = targetUrl.replace(/^https?:\/\//, '');

        var ua = navigator.userAgent || "";
        var isFB = ua.indexOf("FBAN") > -1 || ua.indexOf("FBAV") > -1 || ua.indexOf("FB_IAB") > -1;
        var isAndroid = /android/i.test(ua);

        if (isFB && isAndroid) {
            // Trik 1: Paksa keluar dari In-App Browser FB menuju Google Chrome
            // Chrome kemudian yang akan memicu intent Shopee secara native tanpa pop-up FB
            var chromeBypassIntent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
            window.location.replace(chromeBypassIntent);
        } else if (isAndroid) {
            // Jika dibuka di browser biasa di Android, tembak intent Shopee
            var shopeeIntent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.shopee.id;end";
            window.location.replace(shopeeIntent);
        } else {
            // iOS atau Desktop
            window.location.replace(targetUrl);
        }
    </script>
</body>
</html>
